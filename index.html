<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConvYH V2</title>

  <style>
    :root {
      --bg: #050008;
      --accent: #a855ff;
      --accent-soft: #6b21ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: #f9f5ff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* background container */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at top left, #1a0b33 0, #050008 45%, #000 100%);
    }

    /* space particles */
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 1);
      border-radius: 50%;
      opacity: 0.9;
      filter: blur(1.5px);
      animation: float linear, twinkle ease-in-out infinite;
    }

    /* slow drifting motion */
    @keyframes float {
      from {
        transform: translateY(0) translateX(0);
      }
      to {
        transform: translateY(40vh) translateX(20px);
      }
    }

    /* subtle brightness pulse */
    @keyframes twinkle {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }

    /* big title */
    .title {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 60px;
      text-shadow: 0 0 25px rgba(168, 85, 255, 0.6);
    }

    /* bottom circle buttons */
    .menu {
      display: flex;
      gap: 60px;
    }

    .circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(20, 0, 40, 0.8);
      border: 2px solid rgba(168, 85, 255, 0.4);
      box-shadow: 0 0 20px rgba(168, 85, 255, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .circle:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 30px rgba(168, 85, 255, 0.9);
    }
  </style>
</head>

<body>
  <div class="bg" id="bg"></div>

  <div class="title">ConvYH V2</div>

  <div class="menu">
    <div class="circle" onclick="navigate('browser.html')">Browser</div>
    <div class="circle" onclick="navigate('games.html')">Games</div>
    <div class="circle" onclick="navigate('settings.html')">Settings</div>
  </div>

  <script>
    function navigate(page) {
      window.location.href = page;
    }

    // Space particles
    const bg = document.getElementById("bg");
    const particleCount = 10; // low amount

    function createParticle() {
      const p = document.createElement("div");
      p.classList.add("particle");

      const startX = Math.random() * window.innerWidth;
      const startY = Math.random() * window.innerHeight;

      const duration = 12 + Math.random() * 10; 
      // slow drifting (12–22s)

      p.style.left = `${startX}px`;
      p.style.top = `${startY}px`;
      p.style.animationDuration = `${duration}s`;

      bg.appendChild(p);

      setTimeout(() => p.remove(), duration * 1000);
    }

    // spawn slowly
    setInterval(() => {
      createParticle();
    }, 900);
  </script>
</body>
</html>
