<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConvYH V2</title>

  <style>
    :root {
      --bg: #050008;
      --accent: #a855ff;
      --accent-soft: #6b21ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: #f9f5ff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* background container */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at top left, #1a0b33 0, #050008 45%, #000 100%);
    }

    /* floating squares */
    .square {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(135deg, rgba(168, 85, 255, 0.18), rgba(107, 33, 255, 0.05));
      box-shadow: 0 0 25px rgba(168, 85, 255, 0.35);
      backdrop-filter: blur(4px);
      transition: transform 10s linear;
    }

    /* big title */
    .title {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 60px;
      text-shadow: 0 0 25px rgba(168, 85, 255, 0.6);
    }

    /* bottom circle buttons */
    .menu {
      display: flex;
      gap: 60px;
    }

    .circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(20, 0, 40, 0.8);
      border: 2px solid rgba(168, 85, 255, 0.4);
      box-shadow: 0 0 20px rgba(168, 85, 255, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .circle:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 30px rgba(168, 85, 255, 0.9);
    }
  </style>
</head>

<body>
  <div class="bg">
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
  </div>

  <div class="title">ConvYH V2</div>

  <div class="menu">
    <div class="circle" onclick="navigate('browser.html')">Browser</div>
    <div class="circle" onclick="navigate('games.html')">Games</div>
    <div class="circle" onclick="navigate('settings.html')">Settings</div>
  </div>

  <script>
    // Navigation
    function navigate(page) {
      window.location.href = page;
    }

    // Free‑moving squares
    const squares = document.querySelectorAll('.square');

    function randomMove(square) {
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      square.style.transform = `translate(${x}px, ${y}px)`;
    }

    squares.forEach(square => {
      randomMove(square);
      setInterval(() => randomMove(square), 8000);
    });
  </script>
</body>
  </html>
