<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2048 Game</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #faf8ef;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .game {
      width: 400px;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .a {
      font-size: 40px;
      font-weight: 800;
      color: #776e65;
    }
    .score {
      background: #bbada0;
      padding: 5px 20px;
      color: white;
      border-radius: 3px;
      text-align: center;
      font-weight: bold;
    }
    .field {
      background: #bbada0;
      padding: 10px;
      border-radius: 6px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
      width: 360px;
      height: 360px;
    }
    .cell {
      background: rgba(238, 228, 218, 0.35);
      border-radius: 3px;
    }
    .description {
      font-size: 14px;
      color: #776e65;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="game">
    <div class="head">
      <div class="a">2048</div>
      <div class="score">SCORE<br><span id="value">0</span></div>
    </div>
    
    <div class="field">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>

    <div class="description">
      Use your [arrow keys](0.6.5) to slide tiles. Merge matching numbers to reach [2048](0.6.1)!
    </div>
  </div>

</body>
</html>
