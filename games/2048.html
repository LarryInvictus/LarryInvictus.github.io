<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2048 Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Clear+Sans:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{
      --bg: #faf8ef;
      --board: #bbada0;
      --tile-light: rgba(238,228,218,0.35);
      --text-dark: #776e65;
      --cell-gap: 12px;
      --size: 400px;
    }
    *{box-sizing:border-box}
    body {
      font-family: 'Clear Sans', 'Nunito', sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: var(--text-dark);
    }
    .game {
      width: var(--size);
      max-width: calc(100% - 40px);
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title {
      display:flex;flex-direction:column;
    }
    .a {
      font-size: 54px;
      font-weight: 700;
      color: #776e65;
      letter-spacing: 2px;
      line-height: 1;
    }
    .sub {font-size:14px;color:#bbada0;margin-top:6px}

    .scores{display:flex;gap:12px;align-items:center}
    .score {
      background: #bbada0;
      padding: 8px 14px;
      color: white;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      min-width:72px;
    }
    .score small{display:block;font-size:11px;opacity:0.9}
    .controls{display:flex;gap:10px}
    button.btn{background:#8f7a66;color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}

    .board-wrap{position:relative}
    .field {
      background: var(--board);
      padding: var(--cell-gap);
      border-radius: 6px;
      width: var(--size);
      height: var(--size);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: var(--cell-gap);
      position: relative;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    .cell {
      background: rgba(238, 228, 218, 0.35);
      border-radius: 6px;
      min-height: calc((var(--size) - (var(--cell-gap) * 5)) / 4);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* floating tiles container */
    .tiles {
      position:absolute;left:var(--cell-gap);top:var(--cell-gap);right:var(--cell-gap);bottom:var(--cell-gap);pointer-events:none;
    }
    .tile {
      position:absolute;display:flex;align-items:center;justify-content:center;border-radius:6px;
      font-weight:700;color:#f9f6f2;box-shadow: 0 4px 0 rgba(0,0,0,0.12);
      transition: transform 120ms ease, background 120ms ease, left 120ms ease, top 120ms ease;
      transform-origin:center center;
      user-select:none;
    }
    .tile.new{animation:pop 180ms ease}
    .tile.merge{animation:pop 220ms ease}
    @keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.1)}100%{transform:scale(1)}}

    .tile.small{font-size:18px}

    .description {
      font-size: 14px;
      color: var(--text-dark);
      margin-top: 15px;
    }

    .notice{font-size:12px;color:#999;margin-top:10px}

    @media (max-width:480px){
      :root{--size:340px}
      .a{font-size:44px}
    }
  </style>
</head>
<body>

  <div class="game">
    <div class="head">
      <div class="title">
        <div class="a">2048</div>
        <div class="sub">Join the numbers and get to the 2048 tile!</div>
      </div>
      <div class="scores">
        <div class="score">SCORE<br><small id="value">0</small></div>
        <div class="score">BEST<br><small id="best">0</small></div>
        <div class="controls"><button class="btn" id="new">New Game</button></div>
      </div>
    </div>
    
    <div class="board-wrap">
      <div class="field" id="field">
        <!-- base cells for layout -->
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

        <div class="tiles" id="tiles"></div>
      </div>
    </div>

    <div class="description">
      Use arrow keys or swipe to move tiles. Merge matching numbers to reach 2048!
    </div>
    <div class="notice">Animations: spawn and merge are animated. Movement is smoothly transitioned.</div>
  </div>

<script>
(function(){
  const SIZE = 4;
  const fieldEl = document.getElementById('field');
  const tilesContainer = document.getElementById('tiles');
  const scoreEl = document.getElementById('value');
  const bestEl = document.getElementById('best');
  const newBtn = document.getElementById('new');

  const CELL_GAP = 12;
  let TILE_SIZE = 0; // will compute

  let board = []; // numbers
  let anims = []; // null | 'new' | 'merge'
  let score = 0;
  let best = Number(localStorage.getItem('2048_best')||0);
  bestEl.textContent = best;

  function computeSizes(){
    const fieldRect = fieldEl.getBoundingClientRect();
    const totalGap = CELL_GAP * (SIZE + 1);
    TILE_SIZE = (fieldRect.width - totalGap) / SIZE;
  }

  function reset(){
    board = Array.from({length:SIZE},()=>Array.from({length:SIZE},()=>0));
    anims = Array.from({length:SIZE},()=>Array.from({length:SIZE},()=>null));
    score = 0; updateScore(); tilesContainer.innerHTML='';
    addRandom(true); addRandom(true); render();
  }

  function updateScore(){ scoreEl.textContent = score; if(score>best){ best=score; bestEl.textContent=best; localStorage.setItem('2048_best',best); }}

  function addRandom(initial=false){
    const empties = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===0) empties.push([r,c]);
    if(empties.length===0) return false;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    board[r][c] = Math.random()<0.9?2:4;
    anims[r][c] = initial?null:'new';
    return true;
  }

  function tileBg(v){
    const map = {
      2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'
    };
    return map[v]||'#3c3a32';
  }

  function render(){
    computeSizes();
    // clear tiles container and recreate from board
    tilesContainer.innerHTML = '';
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const val = board[r][c];
        if(val===0) continue;
        const el = document.createElement('div');
        el.className = 'tile';
        el.style.width = TILE_SIZE + 'px';
        el.style.height = TILE_SIZE + 'px';
        el.style.left = (c*(TILE_SIZE + CELL_GAP)) + 'px';
        el.style.top = (r*(TILE_SIZE + CELL_GAP)) + 'px';
        el.style.fontSize = val>=1024? '18px' : (val>=128? '20px' : '24px');
        el.style.background = tileBg(val);
        el.style.color = val<=4 ? '#776e65' : '#f9f6f2';
        el.textContent = val;
        if(anims[r][c]) el.classList.add(anims[r][c]);
        tilesContainer.appendChild(el);
      }
    }
    // clear anim flags after animation duration
    setTimeout(()=>{ for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) anims[r][c]=null; },300);
  }

  function canMove(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===0) return true;
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE-1;c++) if(board[r][c]===board[r][c+1]) return true;
    for(let c=0;c<SIZE;c++) for(let r=0;r<SIZE-1;r++) if(board[r][c]===board[r+1][c]) return true;
    return false;
  }

  function move(direction){
    let moved = false;
    let mergedThisMove = Array.from({length:SIZE},()=>Array.from({length:SIZE},()=>false));

    const range = (start, end, step) => { const arr=[]; for(let i=start;i!==end;i+=step) arr.push(i); return arr; }

    if(direction==='left' || direction==='right'){
      for(let r=0;r<SIZE;r++){
        const cols = direction==='left'? range(0,SIZE,1) : range(SIZE-1,-1,-1);
        for(let i=0;i<cols.length;i++){
          for(let j=i+1;j<cols.length;j++){
            const c1 = cols[i], c2 = cols[j];
            if(board[r][c2]===0) continue;
            if(board[r][c1]===0){ board[r][c1]=board[r][c2]; board[r][c2]=0; anims[r][c1]=null; moved=true; i--; break; }
            else if(board[r][c1]===board[r][c2] && !mergedThisMove[r][c1] && !mergedThisMove[r][c2]){
              board[r][c1]*=2; board[r][c2]=0; mergedThisMove[r][c1]=true; score+=board[r][c1]; anims[r][c1]='merge'; moved=true; break;
            }
            else break;
          }
        }
      }
    } else {
      for(let c=0;c<SIZE;c++){
        const rows = direction==='up'? range(0,SIZE,1) : range(SIZE-1,-1,-1);
        for(let i=0;i<rows.length;i++){
          for(let j=i+1;j<rows.length;j++){
            const r1 = rows[i], r2 = rows[j];
            if(board[r2][c]===0) continue;
            if(board[r1][c]===0){ board[r1][c]=board[r2][c]; board[r2][c]=0; anims[r1][c]=null; moved=true; i--; break; }
            else if(board[r1][c]===board[r2][c] && !mergedThisMove[r1][c] && !mergedThisMove[r2][c]){
              board[r1][c]*=2; board[r2][c]=0; mergedThisMove[r1][c]=true; score+=board[r1][c]; anims[r1][c]='merge'; moved=true; break;
            }
            else break;
          }
        }
      }
    }

    if(moved){
      addRandom(false);
      updateScore();
      render();
      if(!canMove()) setTimeout(()=>gameOver(),200);
    }
    return moved;
  }

  function gameOver(){
    const overlay = document.createElement('div');
    overlay.style.position='fixed';overlay.style.left=0;overlay.style.top=0;overlay.style.right=0;overlay.style.bottom=0;overlay.style.background='rgba(0,0,0,0.35)';overlay.style.display='flex';overlay.style.alignItems='center';overlay.style.justifyContent='center';
    overlay.innerHTML = `<div style="background:white;padding:18px;border-radius:10px;text-align:center;max-width:320px"><h3 style='margin:0 0 8px'>Game Over</h3><p style='margin:0 0 12px'>Your score: ${score}</p><div style='display:flex;gap:8px;justify-content:center'><button id='again' class='btn'>Play again</button><button id='close' class='btn'>Close</button></div></div>`;
    document.body.appendChild(overlay);
    document.getElementById('again').addEventListener('click',()=>{ overlay.remove(); reset(); });
    document.getElementById('close').addEventListener('click',()=>{ overlay.remove(); });
  }

  // keyboard
  window.addEventListener('keydown',function(e){
    const key = e.key;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(key)){
      if(['w','a','s','d'].includes(key)){
        // map wasd
        const m = {w:'up',s:'down',a:'left',d:'right'}; move(m[key]);
        e.preventDefault(); return;
      }
      e.preventDefault();
      const dir = key.replace('Arrow','').toLowerCase();
      move(dir);
    }
  });

  // touch (swipe)
  let startX=0,startY=0;
  window.addEventListener('touchstart',e=>{
    const t = e.touches[0]; startX=t.clientX; startY=t.clientY;
  },{passive:true});
  window.addEventListener('touchend',e=>{
    const t = e.changedTouches[0]; const dx = t.clientX-startX; const dy = t.clientY-startY;
    if(Math.abs(dx)<30 && Math.abs(dy)<30) return;
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
  });

  window.addEventListener('resize',()=>{ render(); });
  newBtn.addEventListener('click',reset);

  // init
  reset();
})();
</script>

</body>
</html>
