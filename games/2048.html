<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2048 Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{
      --bg: #faf8ef;
      --board: #bbada0;
      --tile-light: rgba(238,228,218,0.35);
      --text-dark: #776e65;
    }
    *{box-sizing:border-box}
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .game {
      width: 420px;
      max-width: calc(100% - 40px);
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .a {
      font-size: 48px;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: 2px;
    }
    .score {
      background: var(--board);
      padding: 8px 16px;
      color: white;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
    }
    .score small{display:block;font-size:12px;opacity:0.9}

    .field {
      background: var(--board);
      padding: 12px;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 12px;
      width: 100%;
      height: auto;
    }
    .cell {
      background: var(--tile-light);
      border-radius: 6px;
      min-height: 72px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight: 700;
      font-size: 24px;
      color: #776e65;
    }
    .tile {
      position: relative;
      width: 100%;
      height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:6px;
      color: #f9f6f2;
      font-weight: 700;
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
      transition: transform 120ms ease, background 120ms ease;
    }
    .tile.small{font-size:20px}
    .description {
      font-size: 14px;
      color: var(--text-dark);
      margin-top: 15px;
    }
    .controls{display:flex;gap:10px;align-items:center}
    button.btn{background:#8f7a66;color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
    .overlay{
      position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);
    }
    .dialog{background:white;padding:20px;border-radius:8px;max-width:320px;text-align:center}
  </style>
</head>
<body>

  <div class="game">
    <div class="head">
      <div class="a">2048</div>
      <div class="controls">
        <div class="score">SCORE<br><span id="value">0</span></div>
        <button class="btn" id="new">New Game</button>
      </div>
    </div>
    
    <div class="field" id="field">
      <!-- cells created by JS -->
    </div>

    <div class="description">
      Use arrow keys or swipe to move tiles. Merge matching numbers to reach 2048!
    </div>
  </div>

  <template id="cell-tpl"><div class="cell"><div class="tile"></div></div></template>

<script>
(function(){
  const SIZE = 4;
  const fieldEl = document.getElementById('field');
  const scoreEl = document.getElementById('value');
  const newBtn = document.getElementById('new');

  let board = []; // 2D array
  let score = 0;

  function makeGrid(){
    fieldEl.innerHTML = '';
    for(let i=0;i<SIZE*SIZE;i++){
      const tpl = document.getElementById('cell-tpl').content.cloneNode(true);
      fieldEl.appendChild(tpl);
    }
  }

  function reset(){
    board = Array.from({length:SIZE},()=>Array.from({length:SIZE},()=>0));
    score = 0;
    updateScore();
    makeGrid();
    addRandom();
    addRandom();
    render();
  }

  function updateScore(){ scoreEl.textContent = score; }

  function addRandom(){
    const empties = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===0) empties.push([r,c]);
    if(empties.length===0) return false;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    board[r][c] = Math.random()<0.9?2:4;
    return true;
  }

  function render(){
    const cells = Array.from(fieldEl.children);
    let idx = 0;
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const val = board[r][c];
        const cell = cells[idx++];
        const tile = cell.querySelector('.tile');
        if(!tile) continue;
        if(val===0){
          tile.style.background='transparent';
          tile.textContent='';
          tile.className='tile';
        } else {
          tile.textContent = val;
          tile.className = 'tile';
          if(val<8) tile.style.color='#776e65'; else tile.style.color='white';
          const bg = tileBg(val);
          tile.style.background = bg;
          if(val>=1024) tile.classList.add('small');
        }
      }
    }
  }

  function tileBg(v){
    const map = {
      2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'
    };
    return map[v]||'#3c3a32';
  }

  function canMove(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===0) return true;
    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE-1;c++) if(board[r][c]===board[r][c+1]) return true;
    }
    for(let c=0;c<SIZE;c++){
      for(let r=0;r<SIZE-1;r++) if(board[r][c]===board[r+1][c]) return true;
    }
    return false;
  }

  function move(direction){
    // direction: 'up','down','left','right'
    let moved = false;
    let mergedThisMove = Array.from({length:SIZE},()=>Array.from({length:SIZE},()=>false));

    const range = (start, end, step) => { const arr=[]; for(let i=start;i!==end;i+=step) arr.push(i); return arr; }

    if(direction==='left' || direction==='right'){
      for(let r=0;r<SIZE;r++){
        const cols = direction==='left'? range(0,SIZE,1) : range(SIZE-1,-1,-1);
        for(let i=0;i<cols.length;i++){
          for(let j=i+1;j<cols.length;j++){
            const c1 = cols[i], c2 = cols[j];
            if(board[r][c2]===0) continue;
            if(board[r][c1]===0){ board[r][c1]=board[r][c2]; board[r][c2]=0; moved=true; i--; break; }
            else if(board[r][c1]===board[r][c2] && !mergedThisMove[r][c1] && !mergedThisMove[r][c2]){
              board[r][c1]*=2; board[r][c2]=0; mergedThisMove[r][c1]=true; score+=board[r][c1]; moved=true; break;
            }
            else break;
          }
        }
      }
    } else {
      for(let c=0;c<SIZE;c++){
        const rows = direction==='up'? range(0,SIZE,1) : range(SIZE-1,-1,-1);
        for(let i=0;i<rows.length;i++){
          for(let j=i+1;j<rows.length;j++){
            const r1 = rows[i], r2 = rows[j];
            if(board[r2][c]===0) continue;
            if(board[r1][c]===0){ board[r1][c]=board[r2][c]; board[r2][c]=0; moved=true; i--; break; }
            else if(board[r1][c]===board[r2][c] && !mergedThisMove[r1][c] && !mergedThisMove[r2][c]){
              board[r1][c]*=2; board[r2][c]=0; mergedThisMove[r1][c]=true; score+=board[r1][c]; moved=true; break;
            }
            else break;
          }
        }
      }
    }

    if(moved){
      addRandom();
      updateScore();
      render();
      if(!canMove()) setTimeout(()=>gameOver(),200);
    }
    return moved;
  }

  function gameOver(){
    const overlay = document.createElement('div');
    overlay.className='overlay';
    overlay.innerHTML = `<div class="dialog"><h3>Game Over</h3><p>Your score: ${score}</p><button class="btn" id="again">Play again</button></div>`;
    document.body.appendChild(overlay);
    document.getElementById('again').addEventListener('click',()=>{ overlay.remove(); reset(); });
  }

  // keyboard
  window.addEventListener('keydown',function(e){
    const key = e.key;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(key)){
      e.preventDefault();
      const dir = key.replace('Arrow','').toLowerCase();
      move(dir);
    }
  });

  // touch (swipe)
  let startX=0,startY=0;
  window.addEventListener('touchstart',e=>{
    const t = e.touches[0]; startX=t.clientX; startY=t.clientY;
  },{passive:true});
  window.addEventListener('touchend',e=>{
    const t = e.changedTouches[0]; const dx = t.clientX-startX; const dy = t.clientY-startY;
    if(Math.abs(dx)<30 && Math.abs(dy)<30) return;
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
  });

  newBtn.addEventListener('click',reset);

  // init
  reset();
})();
</script>

</body>
</html>
