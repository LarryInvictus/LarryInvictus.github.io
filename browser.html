<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConvYH • Browser</title>

  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    :root {
      --bg: #050008;
      --accent: #a855ff;
      --accent-soft: #6b21ff;
      --glass: rgba(20, 0, 40, 0.55);
    }

    body {
      margin: 0;
      background: var(--bg);
      font-family: Arial, sans-serif;
      color: #f9f5ff;
      overflow: hidden;
    }

    /* Background squares */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .square {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(135deg, rgba(168, 85, 255, 0.18), rgba(107, 33, 255, 0.05));
      box-shadow: 0 0 25px rgba(168, 85, 255, 0.35);
      backdrop-filter: blur(4px);
      transition: transform 10s linear;
    }

    /* Tab bar */
    .uptop-baraa {
      display: flex;
      align-items: center;
      padding: 8px;
      background: var(--glass);
      border-bottom: 1px solid rgba(168, 85, 255, 0.4);
      box-shadow: 0 0 18px rgba(168, 85, 255, 0.3);
    }

    .tabaa {
      padding: 8px 16px;
      margin-right: 6px;
      border-radius: 10px;
      background: rgba(10, 0, 25, 0.55);
      border: 1px solid rgba(168, 85, 255, 0.4);
      box-shadow: 0 0 12px rgba(168, 85, 255, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tabaa.activeaa {
      background: rgba(30, 0, 60, 0.65);
      border-color: rgba(168, 85, 255, 0.8);
      box-shadow: 0 0 22px rgba(168, 85, 255, 0.5);
    }

    .add-tabaa {
      margin-left: auto;
      padding: 8px;
      border-radius: 10px;
      background: rgba(10, 0, 25, 0.55);
      border: 1px solid rgba(168, 85, 255, 0.4);
      cursor: pointer;
      box-shadow: 0 0 12px rgba(168, 85, 255, 0.25);
    }

    /* Browser bar */
    .browser-baraa {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: var(--glass);
      border-bottom: 1px solid rgba(168, 85, 255, 0.4);
      box-shadow: 0 0 18px rgba(168, 85, 255, 0.3);
    }

    .browser-baraa button {
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(10, 0, 25, 0.55);
      border: 1px solid rgba(168, 85, 255, 0.4);
      color: #d8b4ff;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(168, 85, 255, 0.25);
      transition: 0.2s ease;
    }

    .browser-baraa button:hover {
      border-color: rgba(168, 85, 255, 0.8);
      box-shadow: 0 0 22px rgba(168, 85, 255, 0.5);
      color: #f0d9ff;
    }

    /* Address bar */
    .address-baraa {
      flex: 1;
      display: flex;
      align-items: center;
      background: rgba(10, 0, 25, 0.55);
      border-radius: 12px;
      border: 1px solid rgba(168, 85, 255, 0.4);
      padding: 6px 12px;
      box-shadow: 0 0 12px rgba(168, 85, 255, 0.25);
    }

    #url-baraa {
      flex: 1;
      background: transparent;
      border: none;
      color: #f9f5ff;
      font-size: 16px;
      outline: none;
    }

    /* Browser frame */
    .browser-frame {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      bottom: 10px;

      border-radius: 18px;
      border: 2px solid rgba(168, 85, 255, 0.45);
      background: rgba(10, 0, 25, 0.55);
      box-shadow: 0 0 30px rgba(168, 85, 255, 0.5);

      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Quote widget */
    .quote-box {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 14px 22px;
      border-radius: 12px;
      background: var(--glass);
      border: 1px solid rgba(168, 85, 255, 0.55);
      backdrop-filter: blur(6px);
      color: #d8b4ff;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      box-shadow: 0 0 18px rgba(168, 85, 255, 0.45);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .quote-box:hover {
      border-color: rgba(168, 85, 255, 0.9);
      box-shadow: 0 0 28px rgba(168, 85, 255, 0.7);
      color: #f0d9ff;
    }
  </style>
</head>

<body>

  <!-- Background squares -->
  <div class="bg">
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
  </div>

  <!-- Tabs -->
  <div class="uptop-baraa">
    <div class="tabaa activeaa">
      <span class="tab-nameaa">New Tab</span>
      <i class="fas fa-times close-btnaa"></i>
    </div>
    <div class="add-tabaa" id="add-tabaa">
      <i class="fa-solid fa-circle-plus"></i>
    </div>
  </div>

  <!-- Browser bar -->
  <div class="browser-baraa">
    <button class="backward-buttonaa"><i class="fas fa-arrow-left"></i></button>
    <button class="forward-buttonaa"><i class="fas fa-arrow-right"></i></button>
    <button class="reload-buttonaa"><i class="fas fa-redo"></i></button>
    <button class="home-buttonaa"><i class="fas fa-home"></i></button>

    <div class="address-baraa">
      <i class="fas fa-lock"></i>
      <input type="text" id="url-baraa" placeholder="Enter a URL">
    </div>

    <button class="fullscreen-button"><i class="fas fa-expand"></i></button>
    <button class="settings-buttonaa"><i class="fas fa-cog"></i></button>
    <button class="menu-buttonaa">⋮</button>
  </div>

  <!-- Browser frame -->
  <div class="browser-frame">
    <iframe id="browser-frame"></iframe>
  </div>

  <!-- Quote widget -->
  <div class="quote-box">Click for a quote</div>

  <script>
    /* Floating squares */
    const squares = document.querySelectorAll('.square');
    function randomMove(square) {
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      square.style.transform = `translate(${x}px, ${y}px)`;
    }
    squares.forEach(sq => {
      randomMove(sq);
      setInterval(() => randomMove(sq), 8000);
    });

    /* Quotes */
    const quoteBox = document.querySelector(".quote-box");
    let quotes = [];

    fetch("quotes.json")
      .then(res => res.json())
      .then(data => quotes = data);

    quoteBox.addEventListener("click", () => {
      if (!quotes.length) return;
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      quoteBox.textContent = q;
    });
  </script>

</body>
                                 </html>
