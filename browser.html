<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browser (Google proxy)</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial; margin:0;padding:0;}
    header{background:#0f62fe;color:#fff;padding:12px 16px;display:flex;gap:8px;align-items:center}
    input[type=text]{flex:1;padding:8px;border-radius:6px;border:0}
    button{padding:8px 12px;border-radius:6px;border:0;cursor:pointer;background:#ffffff22;color:#fff}
    .wrap{height:calc(100vh - 56px)}
    iframe{width:100%;height:100%;border:0}
    .notice{padding:8px;color:#333;background:#fff;border-bottom:1px solid #eee}
  </style>
</head>
<body>
  <header>
    <div style="font-weight:700">Google Proxy</div>
    <input id="q" type="text" placeholder="Search Google (via proxy) or enter full URL" />
    <button id="go">Go</button>
    <button id="home">Home</button>
  </header>
  <div class="notice">This uses a public HTTP proxy to load pages (may not work for all sites). Use responsibly.</div>
  <div class="wrap">
    <iframe id="view" sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe>
  </div>

<script>
// We'll use jina.ai's http proxy endpoint which fetches and returns HTML (https://r.jina.ai/http://example.com)
// If you type a full URL it will proxy that URL. If you type a search, it will perform a Google search via proxy.

const input = document.getElementById('q');
const go = document.getElementById('go');
const home = document.getElementById('home');
const view = document.getElementById('view');

function proxyFor(url){
  // ensure protocol
  if(!/^https?:\/\//.test(url)) url = 'http://' + url;
  // Use jina.ai http proxy
  return 'https://r.jina.ai/http://' + url.replace(/^https?:\/\//,'');
}

function doLoad(){
  const val = input.value.trim();
  if(!val) return;
  let target = val;
  if(!/^https?:\/\//.test(val) && !val.includes(' ')){
    // treat as host or path
    if(val.includes('.')) target = val; else target = 'www.'+val+'.com';
    view.src = proxyFor(target);
    return;
  }
  if(val.includes(' ')){
    // treat as search terms
    const q = encodeURIComponent(val);
    view.src = 'https://r.jina.ai/http://www.google.com/search?q='+q;
    return;
  }
  // full URL
  view.src = proxyFor(val);
}

go.addEventListener('click',doLoad);
input.addEventListener('keydown',e=>{ if(e.key==='Enter') doLoad(); });
home.addEventListener('click',()=>{ input.value='www.google.com'; view.src = proxyFor('www.google.com'); });

// load initial
input.value='www.google.com'; view.src = proxyFor('www.google.com');
</script>
</body>
</html>
