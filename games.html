<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConvYH V2 — Games Hub</title>

  <style>
    :root {
      --accent: #b300ff;        /* bright neon purple */
      --accent-bright: #d24dff; /* glow */
      --bg-dark: #000000;
      --bg-purple: #2b004d;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, var(--bg-dark) 0%, #12001f 40%, var(--bg-purple) 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Space particles */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 255, 255, 1);
      border-radius: 50%;
      opacity: 0.9;
      filter: blur(1.5px);
      animation: float linear, twinkle ease-in-out infinite;
    }

    @keyframes float {
      from { transform: translateY(0) translateX(0); }
      to { transform: translateY(40vh) translateX(20px); }
    }

    @keyframes twinkle {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }

    /* Main container */
    .hub {
      margin-top: 60px;
      width: 85%;
      height: calc(100vh - 120px);
      background: rgba(20, 0, 40, 0.7);
      border: 2px solid var(--accent);
      box-shadow: 0 0 35px var(--accent-bright);
      border-radius: 16px;
      padding: 20px;
      overflow-y: auto;
    }

    /* Search bar */
    .search-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .search {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--accent);
      background: rgba(5, 0, 12, 0.9);
      color: #fff;
      font-size: 16px;
      outline: none;
      box-shadow: 0 0 25px var(--accent-bright);
    }

    .dropdown {
      width: 160px;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--accent);
      background: rgba(5, 0, 12, 0.9);
      color: #fff;
      font-size: 16px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 0 25px var(--accent-bright);
    }

    /* Game grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
    }

    .game {
      background: rgba(30, 0, 60, 0.7);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 0 25px var(--accent-bright);
    }

    .game:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 35px var(--accent-bright);
    }

    .game img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="bg" id="bg"></div>

  <div class="hub">

    <div class="search-row">
      <input class="search" id="search" placeholder="Search through games...">
      <select class="dropdown" id="sort">
        <option value="popularity">Popularity</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
      </select>
    </div>

    <div class="grid" id="grid"></div>

  </div>

  <script>
    /* Space particles */
    const bg = document.getElementById("bg");

    function createParticle() {
      const p = document.createElement("div");
      p.classList.add("particle");

      const startX = Math.random() * window.innerWidth;
      const startY = Math.random() * window.innerHeight;
      const duration = 12 + Math.random() * 10;

      p.style.left = `${startX}px`;
      p.style.top = `${startY}px`;
      p.style.animationDuration = `${duration}s`;

      bg.appendChild(p);

      setTimeout(() => p.remove(), duration * 1000);
    }

    setInterval(() => createParticle(), 900);

    /* Game loading */
    const grid = document.getElementById("grid");

    const gamesFolder = [
      "2048.html",
      "dino.html",
      "flappy.html",
      "slope.html",
      "retro-bowl.html",
      "cookie.html",
      "smashkarts.html",
      "drift-boss.html",
      "minesweeper.html",
      "tetris.html",
      "smash-bros.html",
      "pac-man.html",
      "taptapshots.html"
    ];

    let popularity = {};

    async function loadPopularity() {
      try {
        const res = await fetch("popularity.json");
        popularity = await res.json();
      } catch {
        popularity = {};
      }
    }

    async function savePopularity() {
      fetch("popularity.json", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(popularity)
      });
    }

    function loadGames() {
      grid.innerHTML = "";

      gamesFolder.forEach(game => {
        const name = game.replace(".html", "");
        const iconPath = `games/icons/${name}.png`;

        const div = document.createElement("div");
        div.className = "game";

        div.innerHTML = `
          <img src="${iconPath}" onerror="this.src='games/icons/default.png'">
          ${name}
        `;

        div.onclick = () => {
          popularity[name] = (popularity[name] || 0) + 1;
          savePopularity();
          window.location.href = "games/" + game;
        };

        grid.appendChild(div);
      });
    }

    loadPopularity().then(loadGames);

    /* Search filter */
    document.getElementById("search").addEventListener("input", function () {
      const value = this.value.toLowerCase();
      const items = document.querySelectorAll(".game");

      items.forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(value)
          ? "block"
          : "none";
      });
    });

    /* Sorting */
    document.getElementById("sort").addEventListener("change", function () {
      const type = this.value;

      if (type === "popularity") {
        gamesFolder.sort((a, b) => {
          const A = popularity[a.replace(".html", "")] || 0;
          const B = popularity[b.replace(".html", "")] || 0;
          return B - A;
        });
      }

      if (type === "az") {
        gamesFolder.sort();
      }

      if (type === "za") {
        gamesFolder.sort().reverse();
      }

      loadGames();
    });
  </script>

</body>
</html>
